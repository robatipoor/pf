[workspace]
resolver = "2"
members = ["sdk", "api", "cli"]

[workspace.package]
authors = ["Mahdi <Mahdi.robatipoor@gmail.com>"]
description = "A file upload/download service"
documentation = ""
edition = "2024"
homepage = "https://github.com/robatipoor/pf"
keywords = ["paste", "file", "transfer"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/robatipoor/pf"
categories = ["web"]
include = ["src/**/*", "Cargo.*", "LICENSE", "README.md", "CHANGELOG.md"]
version = "0.1.0"

[profile.release]
lto = true
opt-level = "z"
strip = true

[workspace.dependencies]
anyhow = "1.0.97"
argon2 = "0.5.3"
assert_cmd = "2.0.16"
async-stream = "0.3.6"
axum = { version = "0.8.1", features = ["multipart"] }
axum-extra = { version = "0.10.0", features = ["async-read-body"] }
hyper = { version = "1.2.0", features = ["full"] }
hyper-util = { version = "0.1.3" }
rustls-pemfile = "2.2.0"
tokio = { version = "1.43.0", features = [
  "macros",
  "time",
  "process",
  "net",
  "rt-multi-thread",
  "io-std",
] }
tokio-util = { version = "0.7.13", features = ["io"] }
tokio-rustls = "0.26.2"
tower = { version = "0.5.2", features = ["util", "make"] }
tower-http = { version = "0.6.2", features = ["fs", "cors"] }
tower-service = "0.3.2"
base64 = "0.22.1"
bincode = "1.3.3"
build_html = "2.4.0"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.31", features = ["derive"] }
config = { version = "0.15.9", default-features = false, features = ["toml"] }
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
cuid2 = "0.1.4"
fake = { version = "4.0.0", features = ["derive", "chrono"] }
futures-util = "0.3.31"
indicatif = { version = "0.17.11", features = ["tokio"] }
log = "0.4.26"
mime_guess = "2.0.5"
once_cell = { version = "1.20.3" }
qrcode = "0.14.1"
image = "0.25.5"
rand = "0.9.0"
reqwest = { version = "0.12.12", default-features = false, features = [
  "json",
  "multipart",
  "stream",
  "rustls-tls",
] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sled = "0.34.7"
strum = { version = "0.27.1", features = ["derive"] }
test-context = "0.4.1"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
garde = { version = "0.22.0", features = ["full"] }
askama = "0.12.1"
